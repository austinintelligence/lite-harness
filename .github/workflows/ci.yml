      - docker-policy-evidence
      - workspace-lifecycle-evidence
      - run-snapshot-evidence
      - context-optimization-evidence
      - paired-context-evidence
      - backpressure-evidence
      - readiness-evidence
      - observability-evidence
      - status-truth-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          path: .candidate-evidence
      - run: pnpm assemble:ci-evidence -- --source .candidate-evidence --allow-incomplete
        id: assemble_evidence
        if: ${{ always() }}
      - run: pnpm check:secrets -- --include evidence --evidence
        id: evidence_secret_scan
        if: ${{ always() }}
      - run: pnpm check:schemas
        id: schema_check
        if: ${{ always() }}
      - run: pnpm check:evidence
        id: evidence_check
        if: ${{ always() }}
      - run: pnpm check:requirements:verified
        id: verified_requirement_check
        if: ${{ always() }}
      - run: pnpm check:defects:closed
        id: closed_defect_check
        if: ${{ always() }}
      - run: pnpm check:requirements
        id: complete_requirement_check
        if: ${{ always() }}
      - run: pnpm check:defects
        id: complete_defect_check
        if: ${{ always() }}
      - run: pnpm check:status
        id: status_check
        if: ${{ always() }}
      - run: pnpm check:blockers
        id: blocker_check
        if: ${{ always() }}
      - run: pnpm aggregate:evidence
        if: ${{ always() }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          FANIN_CHECKS_JSON: >-
            {"assemble":"${{ steps.assemble_evidence.outcome }}","evidenceSecretScan":"${{ steps.evidence_secret_scan.outcome }}","schemas":"${{ steps.schema_check.outcome }}","evidence":"${{ steps.evidence_check.outcome }}","verifiedRequirements":"${{ steps.verified_requirement_check.outcome }}","closedDefects":"${{ steps.closed_defect_check.outcome }}","completeRequirements":"${{ steps.complete_requirement_check.outcome }}","completeDefects":"${{ steps.complete_defect_check.outcome }}","status":"${{ steps.status_check.outcome }}","blockers":"${{ steps.blocker_check.outcome }}"}
      - run: pnpm check:secrets -- --include evidence/candidate --evidence
        id: aggregate_secret_scan
        if: ${{ always() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.evidence_secret_scan.outcome == 'success' && steps.aggregate_secret_scan.outcome == 'success' }}
        with:
          name: lite-harness-candidate-evidence
          path: evidence/candidate/manifest.json
          if-no-files-found: error
          retention-days: 30
