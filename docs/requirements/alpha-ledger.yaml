    {
      "id": "R16-1524",
      "kind": "contract-requirement",
      "required": true,
      "title": "16. Integrations, MCP, automation, subagents, and memory requirement at line 1524",
      "text": "Rewrite hooks as typed event subscriptions. Policy hooks return a bounded typed decision over RPC with a deadline and fail-closed fallback. Observation hooks receive async events and cannot mutate an active run. “Standing orders” are agent instructions, never security policy.",
      "owner": "optional-packs",
      "source": {
        "document": "LITE_HARNESS_ARCHITECTURE_PLAN.md",
