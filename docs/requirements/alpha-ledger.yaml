      "text": "Support one-shot and recurring schedules, time zones, jitter, missed-run policy, deduplication, per-run model/tool/budget selection, run history, cancellation, and condition checks. The scheduler stores next-fire state durably and leases a trigger before firing so a restart cannot silently double-run it.",
