name: Source export

on:
  pull_request:
    branches: [lite-main]

permissions:
  contents: read

jobs:
  export-source:
    if: ${{ github.head_ref == 'agent/source-export-20260724' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Patch vulnerable transitive dependencies
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          manifest.pnpm = manifest.pnpm ?? {};
          manifest.pnpm.overrides = {
            ...(manifest.pnpm.overrides ?? {}),
            'fast-uri@3.1.3': '3.1.4',
            'fast-uri@4.1.0': '4.1.1',
            'find-my-way@9.6.0': '9.6.1',
          };
          fs.writeFileSync('package.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          pnpm install --lockfile-only
          mkdir -p patched
          cp package.json pnpm-lock.yaml patched/
      - name: Verify production audit after patch
        shell: bash
        run: |
          set +e
          pnpm audit --prod --json > patched/pnpm-audit.json 2> patched/pnpm-audit.stderr
          status=$?
          set -e
          printf '%s\n' "$status" > patched/pnpm-audit.exit-code
          test "$status" -eq 0
      - name: Export exact base tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          base_commit="$(git rev-parse "refs/remotes/origin/${{ github.base_ref }}^{commit}")"
          base_tree="$(git rev-parse "${base_commit}^{tree}")"
          printf '%s\n' "${base_commit}" > base-commit.txt
          printf '%s\n' "${base_tree}" > base-tree.txt
          git archive --format=tar "${base_commit}" | gzip -9 > lite-harness-source.tar.gz
          sha256sum lite-harness-source.tar.gz > lite-harness-source.tar.gz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lite-harness-source-export
          path: |
            base-commit.txt
            base-tree.txt
            lite-harness-source.tar.gz
            lite-harness-source.tar.gz.sha256
            patched/package.json
            patched/pnpm-lock.yaml
            patched/pnpm-audit.json
            patched/pnpm-audit.stderr
            patched/pnpm-audit.exit-code
          if-no-files-found: error
          retention-days: 1
