name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [lite-main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
      - run: pnpm check:artifacts

  repository-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install build==1.3.0
      - run: pnpm build:all
      - run: pnpm audit --prod --audit-level high
      - run: pnpm generate:sbom
      - run: git diff --exit-code -- docs/sbom.cdx.json
      - run: pnpm check:secrets
      - run: pnpm check:provenance
      - run: pnpm check:release
      - run: pnpm check:images -- --evidence evidence/m3/image-promotion.json
      - run: pnpm check:doctor
      - run: pnpm check:truth-structure
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: lite-harness-readiness-evidence
          path: |
            docs/sbom.cdx.json
            docs/IMPLEMENTATION_STATUS.md
            BLOCKERS.md
            docs/requirements/alpha-ledger.yaml
            docs/requirements/defect-ledger.yaml
            evidence/m3/image-promotion.json
            evidence/m11/release-validation.json
            evidence/m11/doctor.json
          if-no-files-found: error
          retention-days: 14

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        context: [docker/tool-runtime, docker/browser-runtime]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  required-real-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build immutable local runtime candidates
        shell: bash
        run: |
          echo "LITE_HARNESS_TEST_DOCKER_IMAGE=$(docker build -q docker/tool-runtime)" >> "$GITHUB_ENV"
          echo "LITE_HARNESS_TEST_BROWSER_IMAGE=$(docker build -q docker/browser-runtime)" >> "$GITHUB_ENV"
      - run: pnpm test:real-runtime -- --evidence evidence/m3/required-real-runtime.json
        env:
          LITE_HARNESS_TEST_MCP_IMAGE: ${{ env.LITE_HARNESS_TEST_DOCKER_IMAGE }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: required-real-runtime
          path: evidence/m3/required-real-runtime.json
          if-no-files-found: error
          retention-days: 30

  python-sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install build==1.3.0
      - run: python -m build --outdir dist/python sdks/python
      - run: python scripts/check_python_distribution.py
      - run: python -m unittest discover -s sdks/python/tests
        env:
          PYTHONPATH: sdks/python/src

  packaged-python-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
