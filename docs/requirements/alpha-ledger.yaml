    {
      "id": "R16-1541",
      "kind": "contract-requirement",
      "required": true,
      "title": "16. Integrations, MCP, automation, subagents, and memory requirement at line 1541",
      "text": "Preserve isolated context, optional transcript fork, per-child model, lower-cost models, nesting/concurrency limits, push completion, cancellation propagation, and restricted child tools. Children do not receive connector delivery tools by default. Writable children use an exclusive lease, isolated worktree/branch, or read-only snapshot—never simultaneous uncoordinated workspace writes.",
