name: Source export

on:
  pull_request:
    branches: [lite-main]

permissions:
  contents: read

jobs:
  export-source:
    if: ${{ github.head_ref == 'agent/source-export-20260724' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Capture production audit
        shell: bash
        run: |
          set +e
          pnpm audit --prod --json > pnpm-audit.json 2> pnpm-audit.stderr
          status=$?
          set -e
          printf '%s\n' "$status" > pnpm-audit.exit-code
      - name: Export exact base tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          base_commit="$(git rev-parse "refs/remotes/origin/${{ github.base_ref }}^{commit}")"
          base_tree="$(git rev-parse "${base_commit}^{tree}")"
          printf '%s\n' "${base_commit}" > base-commit.txt
          printf '%s\n' "${base_tree}" > base-tree.txt
          git archive --format=tar "${base_commit}" | gzip -9 > lite-harness-source.tar.gz
          sha256sum lite-harness-source.tar.gz > lite-harness-source.tar.gz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lite-harness-source-export
          path: |
            base-commit.txt
            base-tree.txt
            lite-harness-source.tar.gz
            lite-harness-source.tar.gz.sha256
            pnpm-audit.json
            pnpm-audit.stderr
            pnpm-audit.exit-code
          if-no-files-found: error
          retention-days: 1
