      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install build==1.3.0
      - run: pnpm build:all
      - run: pnpm check:artifacts --python-wheel --evidence evidence/m1/packaged-artifacts.json --auth-evidence evidence/m2/packaged-auth.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: m1-packaged-artifacts
          path: evidence/m1/packaged-artifacts.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
