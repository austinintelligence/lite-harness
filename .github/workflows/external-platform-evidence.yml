name: External platform evidence

on:
  workflow_dispatch:
    inputs:
      gate:
        description: "Declared external platform lane to qualify, or all lanes for one candidate"
        required: true
        type: choice
        options:
          - all
          - linuxRootful
          - linuxRootless
          - linuxArm64
          - macosIntelDockerDesktop
          - macosAppleSiliconDockerDesktop
          - windows11DockerDesktopWsl2
  workflow_call:
    inputs:
      gate:
        description: "Declared external platform lane to qualify"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rootless-product-evidence:
    name: ${{ matrix.gate }}
    if: ${{ inputs.gate == 'all' || inputs.gate == matrix.gate }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: linuxRootful
            labels: '["self-hosted", "linux", "x64", "docker-rootful"]'
            evidencePath: evidence/external/linux-rootful.json
          - gate: linuxRootless
            labels: '["self-hosted", "linux", "x64", "docker-rootless"]'
            evidencePath: evidence/external/linux-rootless.json
          - gate: linuxArm64
            labels: '["self-hosted", "linux", "arm64", "docker-rootful"]'
            evidencePath: evidence/external/linux-arm64.json
          - gate: macosIntelDockerDesktop
            labels: '["self-hosted", "macos", "x64", "docker-desktop"]'
            evidencePath: evidence/external/macos-intel.json
          - gate: macosAppleSiliconDockerDesktop
            labels: '["self-hosted", "macos", "arm64", "docker-desktop"]'
            evidencePath: evidence/external/macos-apple-silicon.json
          - gate: windows11DockerDesktopWsl2
            labels: '["self-hosted", "windows", "x64", "docker-desktop-wsl2"]'
            evidencePath: evidence/external/windows-wsl2.json
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Run declared external lane
        run: pnpm evidence:external --gate ${{ matrix.gate }} --evidence ${{ matrix.evidencePath }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: external-${{ matrix.gate }}
          path: ${{ matrix.evidencePath }}
          if-no-files-found: error
          retention-days: 30
